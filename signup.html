<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — BrainDock</title>
<meta name="description" content="Create your free BrainDock account and start downloading study notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#2563EB',
          secondary: '#14B8A6',
          bg: '#F8FAFC',
          ink: '#0F172A',
          accent: '#F59E0B',
        },
        fontFamily: {
          display: ['Poppins', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  body { background-color: #F8FAFC; }
  .fade-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeIn 0.6s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  .anchor-cta .anchor-icon { transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .anchor-cta:hover .anchor-icon { transform: translateY(3px) rotate(-8deg); }
  .anchor-cta:disabled { opacity: 0.6; cursor: not-allowed; }

  input:focus { outline: none; }
  .field-wrap:focus-within { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .field-wrap { transition: border-color 0.2s ease, box-shadow 0.2s ease; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  :focus-visible { outline: 2px solid #14B8A6; outline-offset: 2px; }
</style>
</head>
<body class="font-body text-ink antialiased min-h-screen flex items-center justify-center px-6 py-12">

  <div class="w-full max-w-md fade-in">
    <!-- Logo -->
    <a href="index.html" class="flex items-center justify-center gap-2 font-display font-700 text-2xl mb-8">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2V8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="9.5" r="2" stroke="#2563EB" stroke-width="2"/>
        <path d="M5 13C5 13 6.5 19 12 19C17.5 19 19 13 19 13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
        <path d="M2 13H22" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Brain<span class="text-primary">Dock</span></span>
    </a>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <h1 class="font-display font-700 text-2xl text-ink mb-1">Create your account</h1>
      <p class="text-sm text-slate-500 mb-6">Free forever. Drop anchor and start learning.</p>

      <!-- Alert box for errors/success -->
      <div id="alertBox" class="hidden mb-4 text-sm px-4 py-3 rounded-xl"></div>

      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
          <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3">
            <input type="text" id="fullName" required placeholder="Your full name"
              class="w-full text-sm bg-transparent placeholder:text-slate-400" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3">
            <input type="email" id="email" required placeholder="you@example.com"
              class="w-full text-sm bg-transparent placeholder:text-slate-400" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3">
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters"
              class="w-full text-sm bg-transparent placeholder:text-slate-400" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
          <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3">
            <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password"
              class="w-full text-sm bg-transparent placeholder:text-slate-400" />
          </div>
        </div>

        <button type="submit" id="submitBtn"
          class="anchor-cta w-full flex items-center justify-center gap-2 bg-primary hover:bg-blue-700 text-white font-semibold text-sm py-3.5 rounded-full transition-colors mt-2">
          <svg class="anchor-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="5" r="2" stroke="white" stroke-width="2"/>
            <path d="M12 7V19" stroke="white" stroke-width="2"/>
            <path d="M6 12C6 12 7 18 12 18C17 18 18 12 18 12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 12H6" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M18 12H21" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="submitText">Create account</span>
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        Already have an account?
        <a href="login.html" class="text-primary font-semibold hover:underline">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'mb-4 text-sm px-4 py-3 rounded-xl ' +
        (type === 'error'
          ? 'bg-red-50 text-red-600 border border-red-100'
          : 'bg-teal-50 text-secondary border border-teal-100');
      alertBox.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitText.textContent = isLoading ? 'Creating account…' : 'Create account';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', 'error');
        return;
      }
      if (password.length < 6) {
        showAlert('Password must be at least 6 characters.', 'error');
        return;
      }

      setLoading(true);

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName }
        }
      });

      setLoading(false);

      if (error) {
        // Supabase returns a generic message for existing emails in some configs;
        // this covers the common duplicate-account case.
        if (error.message.toLowerCase().includes('already registered') ||
            error.message.toLowerCase().includes('already exists')) {
          showAlert('Account already exists. Try logging in instead.', 'error');
        } else {
          showAlert(error.message, 'error');
        }
        return;
      }

      showAlert('Account created! Redirecting to dashboard…', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    });
  </script>
</body>
</html>
