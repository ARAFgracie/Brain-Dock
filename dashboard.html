<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — BrainDock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#2563EB', secondary: '#14B8A6', bg: '#F8FAFC', ink: '#0F172A', accent: '#F59E0B',
        },
        fontFamily: { display: ['Poppins', 'sans-serif'], body: ['Inter', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  body { background-color: #F8FAFC; }
  .fade-in { opacity: 0; transform: translateY(12px); animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  .note-card { transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
  .note-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -12px rgba(37,99,235,0.2); border-color: #14B8A6; }

  .chip { transition: all 0.2s ease; }
  .chip.active { background-color: #2563EB; color: white; }

  .like-btn.liked svg { fill: #F59E0B; stroke: #F59E0B; }

  .skeleton { background: linear-gradient(90deg,#E2E8F0 25%,#EDF2F7 37%,#E2E8F0 63%); background-size:400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  :focus-visible { outline: 2px solid #14B8A6; outline-offset: 2px; }
</style>
</head>
<body class="font-body text-ink antialiased">

  <!-- ============ NAV ============ -->
  <header class="sticky top-0 z-40 bg-bg/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      <a href="dashboard.html" class="flex items-center gap-2 font-display font-700 text-lg shrink-0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2V8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="9.5" r="2" stroke="#2563EB" stroke-width="2"/>
          <path d="M5 13C5 13 6.5 19 12 19C17.5 19 19 13 19 13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 13H22" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="hidden sm:inline">Brain<span class="text-primary">Dock</span></span>
      </a>

      <!-- Global search — also the hidden admin trigger (/admin) -->
      <div class="flex-1 max-w-lg relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search notes, subject, keywords…"
          class="w-full bg-white border border-slate-200 rounded-full pl-11 pr-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-blue-100" />
      </div>

      <nav class="hidden lg:flex items-center gap-6 text-sm font-medium text-slate-600 shrink-0">
        <a href="dashboard.html" class="text-primary">Dashboard</a>
        <a href="#subjects" class="hover:text-primary transition-colors">Subjects</a>
        <a href="#popular" class="hover:text-primary transition-colors">Popular</a>
        <a href="#latest" class="hover:text-primary transition-colors">Latest</a>
      </nav>

      <div class="relative shrink-0">
        <button id="profileBtn" class="w-9 h-9 rounded-full bg-primary text-white font-display font-600 text-sm flex items-center justify-center">?</button>
        <div id="profileMenu" class="hidden absolute right-0 mt-2 w-44 bg-white border border-slate-200 rounded-xl shadow-lg py-1 text-sm">
          <div class="px-4 py-2 text-slate-400 text-xs">Profile (coming soon)</div>
          <button id="logoutBtn" class="w-full text-left px-4 py-2 text-red-500 hover:bg-red-50 transition-colors">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- ============ WELCOME ============ -->
    <section class="fade-in mb-10">
      <p class="text-xs font-semibold tracking-wide uppercase text-secondary mb-1">Welcome back</p>
      <h1 class="font-display font-700 text-2xl md:text-3xl text-ink" id="welcomeName">Loading…</h1>
      <p class="text-slate-500 mt-1">Your notes are docked and ready.</p>
    </section>

    <!-- ============ SUBJECTS / CATEGORIES ============ -->
    <section id="subjects" class="mb-10 fade-in">
      <h2 class="font-display font-600 text-lg mb-4">Categories</h2>
      <div id="subjectChips" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- ============ FEATURED ============ -->
    <section id="featured" class="mb-12 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-600 text-lg">Featured Notes</h2>
      </div>
      <div id="featuredGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <!-- ============ RECENTLY ADDED ============ -->
    <section id="latest" class="mb-12 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-600 text-lg">Recently Added</h2>
      </div>
      <div id="latestGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <!-- ============ POPULAR ============ -->
    <section id="popular" class="mb-12 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-600 text-lg">Popular Notes</h2>
      </div>
      <div id="popularGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <!-- Empty / no-results state for search -->
    <div id="emptyState" class="hidden text-center py-16">
      <p class="text-slate-400 text-sm">No notes found. Try a different keyword.</p>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-8 mt-8">
    <div class="max-w-7xl mx-auto px-6 text-center text-sm text-slate-500">
      © 2026 BrainDock. Where knowledge anchors.
    </div>
  </footer>

  <script src="js/supabase.js"></script>
  <script>
    const SUBJECTS = ['Bangla','English','Mathematics','Physics','Chemistry','Biology','ICT','Accounting','Finance','Marketing','Programming','Engineering','Medical','Admission'];

    let currentUser = null;
    let likedNoteIds = new Set();
    let activeSubject = null;

    // ---------- AUTH GUARD ----------
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      currentUser = session.user;

      const { data: profile } = await supabaseClient.from('profiles').select('full_name, is_suspended').eq('id', currentUser.id).single();
      if (profile?.is_suspended) {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('welcomeName').textContent = `Hi, ${profile?.full_name || 'Student'}!`;
      document.getElementById('profileBtn').textContent = (profile?.full_name || 'S').charAt(0).toUpperCase();

      await loadLikedNotes();
      renderSubjectChips();
      loadAllSections();
    })();

    // ---------- PROFILE MENU ----------
    document.getElementById('profileBtn').addEventListener('click', () => {
      document.getElementById('profileMenu').classList.toggle('hidden');
    });
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    // ---------- SUBJECT CHIPS ----------
    function renderSubjectChips() {
      const wrap = document.getElementById('subjectChips');
      wrap.innerHTML = '';
      const allChip = makeChip('All', null);
      allChip.classList.add('active');
      wrap.appendChild(allChip);
      SUBJECTS.forEach(s => wrap.appendChild(makeChip(s, s)));
    }
    function makeChip(label, subjectValue) {
      const btn = document.createElement('button');
      btn.className = 'chip text-sm font-medium px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 hover:border-primary';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        activeSubject = subjectValue;
        loadAllSections();
      });
      return btn;
    }

    // ---------- LOAD LIKED NOTES ----------
    async function loadLikedNotes() {
      const { data } = await supabaseClient.from('likes').select('note_id').eq('user_id', currentUser.id);
      likedNoteIds = new Set((data || []).map(l => l.note_id));
    }

    // ---------- LOAD SECTIONS ----------
    async function loadAllSections() {
      await Promise.all([
        loadSection('featuredGrid', { orderBy: 'likes_count', ascending: false, limit: 6 }),
        loadSection('latestGrid', { orderBy: 'created_at', ascending: false, limit: 6 }),
        loadSection('popularGrid', { orderBy: 'downloads', ascending: false, limit: 6 }),
      ]);
    }

    async function loadSection(gridId, { orderBy, ascending, limit }) {
      const grid = document.getElementById(gridId);
      grid.innerHTML = Array(3).fill('<div class="skeleton rounded-2xl h-56"></div>').join('');

      let query = supabaseClient.from('notes').select('*').order(orderBy, { ascending }).limit(limit);
      if (activeSubject) query = query.eq('subject', activeSubject);

      const { data: notes, error } = await query;
      grid.innerHTML = '';

      if (error || !notes || notes.length === 0) {
        grid.innerHTML = '<p class="text-sm text-slate-400 col-span-full">No notes yet in this category.</p>';
        return;
      }
      notes.forEach(note => grid.appendChild(renderNoteCard(note)));
    }

    // ---------- SEARCH ----------
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const value = e.target.value.trim();

      // Hidden admin trigger
      if (value === '/admin') {
        window.location.href = 'admin.html';
        return;
      }

      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => runSearch(value), 300);
    });

    async function runSearch(term) {
      const allSections = ['featured', 'latest', 'popular'];
      if (!term) {
        allSections.forEach(s => document.getElementById(s).classList.remove('hidden'));
        document.getElementById('emptyState').classList.add('hidden');
        loadAllSections();
        return;
      }

      const { data: notes, error } = await supabaseClient
        .from('notes')
        .select('*')
        .or(`title.ilike.%${term}%,subject.ilike.%${term}%`)
        .limit(24);

      allSections.forEach(s => document.getElementById(s).classList.add('hidden'));

      if (error || !notes || notes.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }
      document.getElementById('emptyState').classList.add('hidden');

      // Reuse featured section as the results container during search
      const featuredSection = document.getElementById('featured');
      featuredSection.classList.remove('hidden');
      featuredSection.querySelector('h2').textContent = `Results for "${term}"`;
      const grid = document.getElementById('featuredGrid');
      grid.innerHTML = '';
      notes.forEach(note => grid.appendChild(renderNoteCard(note)));
    }

    // ---------- Desktop hidden admin trigger: double-press F1 ----------
    let lastF1Time = 0;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F1') {
        e.preventDefault();
        const now = Date.now();
        if (now - lastF1Time < 500) {
          window.location.href = 'admin.html';
        }
        lastF1Time = now;
      }
    });

    // ---------- NOTE CARD ----------
    function renderNoteCard(note) {
      const el = document.createElement('div');
      el.className = 'note-card bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col';

      const isLiked = likedNoteIds.has(note.id);
      const uploadDate = new Date(note.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const fileSize = note.file_size_kb ? (note.file_size_kb >= 1024 ? (note.file_size_kb/1024).toFixed(1) + ' MB' : note.file_size_kb + ' KB') : '—';

      el.innerHTML = `
        <div class="h-32 bg-gradient-to-br from-blue-50 to-teal-50 flex items-center justify-center">
          ${note.thumbnail_url
            ? `<img src="${note.thumbnail_url}" alt="${escapeHtml(note.title)}" class="w-full h-full object-cover" />`
            : `<span class="font-display font-700 text-primary text-xl">${escapeHtml(note.subject.slice(0,3).toUpperCase())}</span>`}
        </div>
        <div class="p-4 flex flex-col gap-2 flex-1">
          <span class="text-xs font-semibold text-secondary uppercase tracking-wide">${escapeHtml(note.subject)}</span>
          <h3 class="font-display font-600 text-ink text-sm leading-snug">${escapeHtml(note.title)}</h3>
          <p class="text-xs text-slate-500 line-clamp-2 flex-1">${escapeHtml(note.description || '')}</p>
          <div class="flex items-center justify-between text-xs text-slate-400 mt-1">
            <span>${fileSize}</span>
            <span>${uploadDate}</span>
          </div>
          <div class="flex items-center justify-between text-xs text-slate-400">
            <span>${note.downloads} downloads</span>
            <span>${note.likes_count} likes</span>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <button data-note-id="${note.id}" data-pdf="${note.pdf_url}" class="download-btn flex-1 bg-primary hover:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-full transition-colors">
              Download
            </button>
            <button data-note-id="${note.id}" class="like-btn ${isLiked ? 'liked' : ''} w-9 h-9 shrink-0 rounded-full border border-slate-200 flex items-center justify-center hover:border-accent transition-colors">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="${isLiked ? '#F59E0B' : 'none'}" stroke="${isLiked ? '#F59E0B' : '#94A3B8'}" stroke-width="2">
                <path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 20.3l8.8-8.6a5 5 0 0 0 0-7.1Z"/>
              </svg>
            </button>
          </div>
        </div>
      `;

      el.querySelector('.download-btn').addEventListener('click', () => handleDownload(note));
      el.querySelector('.like-btn').addEventListener('click', (e) => handleLike(note.id, e.currentTarget));

      return el;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ---------- DOWNLOAD ----------
    async function handleDownload(note) {
      // pdf_url is expected to be the storage object path inside the 'pdfs' bucket
      const { data: signed, error } = await supabaseClient.storage.from('pdfs').createSignedUrl(note.pdf_url, 60);
      if (error || !signed) {
        alert('Could not generate download link. Please try again.');
        return;
      }
      window.open(signed.signedUrl, '_blank');
      await supabaseClient.rpc('increment_downloads', { note_id_input: note.id });
    }

    // ---------- LIKE (toggle) ----------
    async function handleLike(noteId, btnEl) {
      const isLiked = likedNoteIds.has(noteId);
      btnEl.disabled = true;

      if (isLiked) {
        const { error } = await supabaseClient.from('likes').delete().eq('user_id', currentUser.id).eq('note_id', noteId);
        if (!error) {
          likedNoteIds.delete(noteId);
          btnEl.classList.remove('liked');
          btnEl.querySelector('svg').setAttribute('fill', 'none');
          btnEl.querySelector('svg').setAttribute('stroke', '#94A3B8');
        }
      } else {
        const { error } = await supabaseClient.from('likes').insert({ user_id: currentUser.id, note_id: noteId });
        if (!error) {
          likedNoteIds.add(noteId);
          btnEl.classList.add('liked');
          btnEl.querySelector('svg').setAttribute('fill', '#F59E0B');
          btnEl.querySelector('svg').setAttribute('stroke', '#F59E0B');
        }
      }
      btnEl.disabled = false;
    }
  </script>
</body>
</html>
